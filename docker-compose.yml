# Local PostgreSQL for development and manual testing
#
#   docker compose up -d
#   docker compose down

services:
  db:
    image: postgres:16-alpine
    container_name: foodanalyzer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: foodanalyzer
    ports:
      - "5432:5432"
    volumes:
      - foodanalyzer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodanalyzer"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  foodanalyzer_pgdata:
